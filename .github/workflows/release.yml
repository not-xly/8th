name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restaurar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.EIGHTH_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/8th-release.jks"

      - name: Compilar APK firmado
        env:
          EIGHTH_KEYSTORE_PATH: ${{ runner.temp }}/8th-release.jks
          EIGHTH_KEY_ALIAS: ${{ secrets.EIGHTH_KEY_ALIAS }}
          EIGHTH_STORE_PASSWORD: ${{ secrets.EIGHTH_STORE_PASSWORD }}
          EIGHTH_KEY_PASSWORD: ${{ secrets.EIGHTH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk 8th.apk

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" 8th.apk --title "8th $GITHUB_REF_NAME" --generate-notes
