# 4G/1G es de sobra para 1 módulo; 8G/4G provocaba swapping del daemon
# + IDE en máquinas con 16 GB sin acelerar el build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Build cache sí; configuration-cache NO: el plugin de Flutter actual no es
# compatible y rompe la configuración del build (8 problemas / discard).
org.gradle.caching=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
