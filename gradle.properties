# 4G is plenty for a single module; larger heaps only swap the daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
android.useAndroidX=true

# Gradle 8.14 no arranca con el JDK 25 por defecto del sistema.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
